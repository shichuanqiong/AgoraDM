name: release

# Tag conventions (monorepo):
#   swarmdm-v*.*.*     -> sdk/  (PyPI: swarmdm — the SDK, renamed from agoradm 2026-10-30)
#   swarmdm-mcp-v*.*.* -> mcp/  (PyPI: swarmdm-mcp — renamed from agoradm-mcp)
#   agoradm-v*.*.*     -> shims/agoradm/     (final agoradm: depends on swarmdm, import alias)
#   agoradm-mcp-v*.*.* -> shims/agoradm-mcp/ (final agoradm-mcp: depends on swarmdm-mcp)
#   sdk-v*.*.* / mcp-v*.*.* -> sdk/ / mcp/ (old tags, kept for history)
#   hermes-v*.*.*  -> build & publish hermes/  (PyPI package: a2a-dm-hermes)
#   uhp-v*.*.*     -> build & publish harnessrouter/ (PyPI package: agoradm-uhp)
#   (placeholders/ held the 0.0.1 name reservations of 2026-10-29)
#
# One-time PyPI setup per package:
#   https://pypi.org/manage/project/<package>/settings/publishing/
#     - Owner: shichuanqiong
#     - Repository name: a2a-dm
#     - Workflow filename: release.yml
#     - Environment name: pypi

on:
  push:
    tags:
      - "sdk-v*.*.*"
      - "mcp-v*.*.*"
      - "hermes-v*.*.*"
      - "uhp-v*.*.*"
      - "swarmdm-v*.*.*"
      - "swarmdm-mcp-v*.*.*"
      - "agoradm-v*.*.*"
      - "agoradm-mcp-v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Pick package dir from tag
        id: pkg
        run: |
          if [[ "${GITHUB_REF_NAME}" == sdk-v* ]]; then
            echo "dir=sdk" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == hermes-v* ]]; then
            echo "dir=hermes" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == uhp-v* ]]; then
            echo "dir=harnessrouter" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == swarmdm-mcp-v* ]]; then
            echo "dir=mcp" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == swarmdm-v* ]]; then
            echo "dir=sdk" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == agoradm-mcp-v* ]]; then
            echo "dir=shims/agoradm-mcp" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == agoradm-v* ]]; then
            echo "dir=shims/agoradm" >> "$GITHUB_OUTPUT"
          else
            echo "dir=mcp" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: python -m build

      - name: Check
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ steps.pkg.outputs.dir }}/dist
